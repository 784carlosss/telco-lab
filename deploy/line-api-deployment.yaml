apiVersion: apps/v1
kind: Deployment
metadata:
  name: line-api
  namespace: telco
spec:
  replicas: 3
  selector:
    matchLabels:
      app: line-api
  template:
    metadata:
      labels:
        app: line-api
    spec:
      containers:
      - name: line-api
        image: line-api:0.1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: DATABASE_URL
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
